<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character Creator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Stardew Valley Character Creator</h1>

    <form id="form">
      <section>
        <label>
          <span>Saved character</span>
          <span class="inline">
            <select name="folder" id="folder"></select>
            <button type="button" id="save" class="secondary">Save</button>
          </span>
          <small>Each folder in <code>characters/</code> with a <code>modDetails.json</code>. Save writes the form to the selected file.</small>
        </label>
      </section>

      <section>
        <h2>Mod details</h2>
        <label>
          <span>Replacing</span>
          <input name="SDV_Name" required>
          <small><code>SDV_Name</code>. The Stardew Valley character being replaced.</small>
        </label>
        <label>
          <span>New character name</span>
          <input name="newCharacterName" required>
          <small><code>newCharacterName</code>. Used in the folder name and the display name.</small>
        </label>
        <label>
          <span>Output folder</span>
          <input name="folderLocation" required>
          <small><code>folderLocation</code>. Relative paths start at the project root.</small>
        </label>
        <label>
          <span>Mod folder name</span>
          <input id="modFolderName" readonly>
          <small><code>modFolderName</code>. Read-only, worked out from the names above.</small>
        </label>
      </section>

      <section>
        <h2>Manifest</h2>
        <label><span>Name</span> <input name="Name" required></label>
        <label><span>Author</span> <input name="Author" required></label>
        <label><span>Version</span> <input name="Version" required></label>
        <label><span>Description</span> <textarea name="Description" rows="2"></textarea></label>
        <label><span>Unique ID</span> <input name="UniqueID" required></label>
        <label><span>Minimum API version</span> <input name="MinimumApiVersion" required></label>
      </section>

      <div class="actions">
        <button type="submit" id="build">Build &amp; open dist folder</button>
        <span id="status" role="status"></span>
      </div>
      <pre id="output" hidden></pre>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
